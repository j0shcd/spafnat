name: Quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'schedule'
    name: Code and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Compile Cloudflare Functions without deploying
        run: npm exec -- wrangler pages functions build --outdir "$RUNNER_TEMP/spaf-functions"

  dependencies:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
      # No package installation or dependency code execution in this job.
      # The Node runtime is not covered by npm audit or npm Dependabot alerts.
      - name: Check the pinned Node security baseline
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pinned = readFileSync('.nvmrc', 'utf8').trim();
          const parts = value => value.replace(/^v/, '').split('.').map(Number);
          const compare = (a, b) => {
            const left = parts(a), right = parts(b);
            return left[0] - right[0] || left[1] - right[1] || left[2] - right[2];
          };
          if (!/^\d+\.\d+\.\d+$/.test(pinned)) throw new Error('Pin an exact Node version in .nvmrc');
          const engines = JSON.parse(readFileSync('package.json', 'utf8')).engines;
          const lockedEngines = JSON.parse(readFileSync('package-lock.json', 'utf8')).packages[''].engines;
          if (readFileSync('.node-version', 'utf8').trim() !== pinned ||
            engines.node !== lockedEngines.node || !engines.node.split(' || ').includes(`^${pinned}`)) {
            throw new Error('Keep runtime pins and manifest/lockfile engine floors aligned');
          }
          const response = await fetch('https://nodejs.org/dist/index.json', {
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`Node release feed returned ${response.status}`);
          const releases = await response.json();
          const security = releases.filter(release => release.security &&
            parts(release.version)[0] === parts(pinned)[0]).sort((a, b) => compare(b.version, a.version));
          if (!security.length) throw new Error('No Node security baseline found');
          if (compare(pinned, security[0].version) < 0) {
            throw new Error(`Node ${security[0].version} security release requires updating the runtime pins and engines`);
          }
          console.log(`Node ${pinned} meets the latest security baseline ${security[0].version}`);
          NODE
      # Include build tools and optional packages. Network errors fail the job.
      - run: npm run audit:deps
